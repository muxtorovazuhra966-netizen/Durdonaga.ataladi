<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Durdona uchun</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
  :root { --bg:#1a0f1c; --fg:#ffd9e2; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a0f1c; --fg:#ffd9e2; } }
  html, body { height:100%; margin:0; background:var(--bg); overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  h1 { position:fixed; left:0; right:0; top:50%; transform:translateY(-50%); margin:0; text-align:center; pointer-events:none;
       font:italic 500 clamp(2.4rem, 11vw, 5.5rem)/1.1 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
       color:#fff4f7; text-shadow:0 2px 18px rgba(26,15,28,.85), 0 0 4px rgba(26,15,28,.6); letter-spacing:.01em; }
  p { position:fixed; left:0; right:0; bottom:max(20px, env(safe-area-inset-bottom, 0px)); margin:0; text-align:center;
      font:15px/1.4 Georgia, 'Times New Roman', serif; color:var(--fg); opacity:.7; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1>Durdona uchun</h1>
<p>Sichqonchani yurak ustida yurgizing</p>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W, H, particles = [];
  var mouse = { x: -9999, y: -9999 };
  var COUNT = 4500;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Yurak shaklidagi nuqta (ichi to'ldirilgan)
  function heartPoint() {
    var t = Math.random() * Math.PI * 2;
    var r = Math.sqrt(Math.random());
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x * r, y: -y * r };
  }

  function build() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scale = Math.min(W, H) / 40;
    var cx = W / 2, cy = H / 2 - scale * 0.5;
    particles = [];
    for (var i = 0; i < COUNT; i++) {
      var p = heartPoint();
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        tx: cx + p.x * scale, ty: cy + p.y * scale,
        vx: 0, vy: 0,
        s: Math.random() * 1.4 + 0.7,
        h: 335 + Math.random() * 25,
        l: 55 + Math.random() * 20
      });
    }
  }

  function move(e) {
    var pt = e.touches ? e.touches[0] : e;
    mouse.x = pt.clientX; mouse.y = pt.clientY;
  }
  function leave() { mouse.x = mouse.y = -9999; }
  window.addEventListener('mousemove', move);
  window.addEventListener('touchstart', move, { passive: true });
  window.addEventListener('touchmove', move, { passive: true });
  window.addEventListener('mouseout', leave);
  window.addEventListener('touchend', leave);
  window.addEventListener('resize', build);

  var t0 = performance.now();
  function frame(now) {
    var beat = reduce ? 1 : 1 + 0.035 * Math.pow(Math.sin((now - t0) / 380), 8) * 3;
    var cx = W / 2, cy = H / 2;
    var R = 90, R2 = R * R;
    ctx.fillStyle = 'rgba(26,15,28,0.28)';
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var tx = cx + (p.tx - cx) * beat, ty = cy + (p.ty - cy) * beat;
      p.vx += (tx - p.x) * 0.045;
      p.vy += (ty - p.y) * 0.045;
      var dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        var d = Math.sqrt(d2) || 1, f = (R - d) / R;
        p.vx += (dx / d) * f * 7;
        p.vy += (dy / d) * f * 7;
      }
      p.vx *= 0.86; p.vy *= 0.86;
      p.x += p.vx; p.y += p.vy;
      ctx.fillStyle = 'hsl(' + p.h + ',85%,' + p.l + '%)';
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    requestAnimationFrame(frame);
  }

  build();
  ctx.fillStyle = '#1a0f1c'; ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
